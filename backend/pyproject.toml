[project]
name = "ltp-gui-backend"
version = "0.1.0"
description = "LTP-GUI — web-интерфейс управления ONT на OLT Eltex LTP-4X/8X"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pysnmp>=6.2,<7.0",
    "asyncssh>=2.14",
    "telnetlib3>=2.0,<3.0",
    "apscheduler>=3.10",
    "loguru>=0.7",
    "icmplib>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
windows = ["pywin32>=306", "pyinstaller>=6.6"]

[tool.setuptools]
packages = ["app"]